[project]
name = "sonicmap-backend"
version = "0.1.0"
description = "Ingestion, feature extraction, and per-user taste brain for the Music Feature Recommendation Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "essentia>=2.1b6.dev1177",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

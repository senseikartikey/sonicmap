name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: sonicmap-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run backend test suite
        # The suite is pure-logic (no DB/MinIO fixtures anywhere in backend/tests), so it runs
        # directly against the built image with no other services needed. Tests aren't baked
        # into the image on purpose (the Dockerfile only COPYs app/alembic, keeping the
        # production image lean) - dev compose supplies them via a bind-mount, and this does
        # the same thing for CI rather than changing what ships in the image.
        run: docker run --rm -v "$PWD/backend/tests:/app/tests" sonicmap-api:ci python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Next.js 16 generates ambient types for typed routes/layout props (e.g.
      # `LayoutProps<"/">`) into .next/ the first time `next dev` or `next build` runs.
      # A clean CI checkout has neither yet, so `tsc --noEmit` needs this first or it
      # fails on names that only exist after a build - `next typegen` does just that
      # generation step, without running a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
